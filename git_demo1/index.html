```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Simple Web Page</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
      margin: 0;
      text-align: center;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 30px;
    }

    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <header>
    <h1>Welcome to My demo page.</h1>
    <p>A simple HTML, CSS, and JavaScript example</p>
  </header>

  <main>
    <h2>Hello, World!</h2>
    <p>This is a clean and beginner-friendly web page.</p>

    <button onclick="showMessage()">Click Me</button>

    <p id="message"></p>
  </main>

  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "Thanks for clicking the button!";
    }
  </script>

</body>
</html>
